<?xml version="1.0" encoding="UTF-8"?>
<!--
  Logotipo do SMSAPI Gateway.

  Mesma geometria do ícone da app Android
  (android/app/src/main/res/drawable/ic_launcher_foreground.xml), para que a
  app e o site mostrem a mesma coisa. É vector, por isso fica nítido em
  qualquer tamanho e serve de favicon sem perda.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108"
     role="img" aria-label="SMSAPI Gateway">
  <rect width="108" height="108" rx="20" fill="#00695C"/>
  <path fill="#FFFFFF"
        d="M40,30 h28 a8,8 0 0 1 8,8 v20 a8,8 0 0 1 -8,8 h-18 l-12,11 v-11 h-6
           a8,8 0 0 1 -8,-8 v-20 a8,8 0 0 1 8,-8 z"/>
  <path fill="#00695C" d="M44,52 L70,42 L58,68 L54,55 Z"/>
</svg>
